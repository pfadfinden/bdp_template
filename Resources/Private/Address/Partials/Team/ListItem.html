<div class="w-full lg:w-1/2 px-3 xl:px-6 mt-6 xl:mt-12">
    <div class="flex flex-wrap items-stretch bg-zentrum-light-gray">
        <div class="relative w-full min-h-[300px] md:w-1/3 lg:w-5/12 2xl:min-h-[350px] md:order-1{f:if(condition: iterator.isOdd , then: ' lg:order-1 md:clip-slant-lt', else: ' lg:order-0 md:clip-slant-lb')}{f:if(condition: '{iterator.cycle} % 4 == 2' , then: ' lg:clip-slant-rt')}{f:if(condition: '{iterator.cycle} % 4 == 3' , then: ' lg:clip-slant-lb')}{f:if(condition: '{iterator.cycle} % 4 == 0' , then: ' lg:clip-slant-rb')}">
            <f:if condition="{address.image}">
                <figure class="block absolute left-0 top-0 bottom-0 right-0">
                    <picture class="block relative w-full h-full overflow-hidden">
                        <source media="(max-width: 2075px)" srcset="{f:uri.image(image: address.firstImage, width: '727c', height: '546c', fileExtension: 'webp')}" type="image/webp">
                        <source media="(max-width: 2075px)" srcset="{f:uri.image(image: address.firstImage, width: '727c', height: '546c', fileExtension: 'jpg')}" type="image/jpeg">
                        <source media="(min-width: 2076px)" srcset="{f:uri.image(image: address.firstImage, width: '1454c', height: '1092c', fileExtension: 'webp')}" type="image/webp">
                        <source media="(min-width: 2076px)" srcset="{f:uri.image(image: address.firstImage, width: '1454c', height: '1092c', fileExtension: 'jpg')}" type="image/jpeg">
                        <f:image image="{address.firstImage}" width="727c" height="546c" additionalAttributes="{loading: 'lazy'}" class="block relative w-full h-full object-cover"/>
                    </picture>
                    <f:if condition="{address.firstImage.properties.copyright}">
                        <div class="absolute bottom-[0.375rem] right-[0.875rem] text-[0.875rem] text-white/60 hover:text-white hover:text-shadow-sm">© {files.0.properties.copyright}</div>
                    </f:if>
                </figure>
            </f:if>
        </div>
        <div class="flex relative py-8 px-[5%] min-h-[1px] w-full flex-col justify-between md:w-2/3 lg:w-7/12 md:order-0 {f:if(condition: iterator.isOdd , then: ' lg:order-0')}">
            <div class="overflow-hidden">
                <h2 class="zt-headline-4">{address.fullName}</h2>
                <f:if condition="{address.position}">
                    <div class="font-semibold text-lg mt-3">
                        {address.position}
                    </div>
                </f:if>
                <ul class="mt-5">
                    <f:if condition="{address.email}">
                        <li class="mb-2"><f:link.email email="{address.email}" class="text-zentrum-dark-blue hover:underline"/></li>
                    </f:if>
                    <f:if condition="{address.phone}">
                        <li>
                            {f:translate(key:'label.telephone')}: <a href="tel:{address.cleanedPhone}" class="hover:underline" >{address.phone}</a>
                        </li>
                    </f:if>
                    <f:if condition="{address.mobile}">
                        <li>
                            {f:translate(key:'label.mobile')}: <a href="tel:{address.cleanedMobile}" class="hover:underline">{address.mobile}</a>
                        </li>
                    </f:if>
                    <f:if condition="{address.fax}">
                        <li>{f:translate(key:'label.fax')}: {address.fax}</li>
                    </f:if>
                </ul>
                <f:if condition="{address.description}">
                    <div class="description pt-4">
                        {address.description -> f:format.html()}
                    </div>
                </f:if>
            </div>
        </div>
    </div>
</div>
