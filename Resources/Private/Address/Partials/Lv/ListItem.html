<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:bdp="http://typo3.org/ns/Pfadfinden/BdpTemplate/ViewHelpers"
      data-namespace-typo3-fluid="true">
<div class="ct-address__list__item mb-4 2xl:mb-6 bg-blue-500 text-white dark:bg-black dark:text-white forced-colors:border p-4 h-fit transition-[grid-row-end] duration-200">
    <div class="ct-address__list__item__box">
        <h3 class="text-xl font-semibold mb-2 text-yellow-500">{address.fullName}</h3>
        <div>
            <f:if condition="{address.address}">
                <address class="py-3">
                    <f:if condition="{address.organisation}">
                        <div>{address.organisation}</div>
                    </f:if>
                    <div>{address.address -> f:format.nl2br()}</div>
                    <div>{address.zip}&nbsp;{address.city}</div>
                </address>
            </f:if>
            <f:if condition="{address.phone} || {address.fax}">
                <ul class="py-3">
                    <f:if condition="{address.phone}">
                        <li>
                            {f:translate(key:'label.telephone')}: <a href="tel:{address.cleanedPhone}" class="hover:text-yellow-light hover:underline">{address.phone}</a>
                        </li>
                    </f:if>
                    <f:if condition="{address.fax}">
                        <li>{f:translate(key:'label.fax')}: {address.fax}</li>
                    </f:if>
                </ul>
            </f:if>
            <f:if condition="{address.email} || {address.www}">
                <ul class="py-3">
                    <f:if condition="{address.email}">
                        <li>E-Mail: <f:link.email email="{address.email}" class="hover:text-yellow-light hover:underline"/></li>
                    </f:if>
                    <f:if condition="{address.www}">
                        <li>
                            Internet: <f:link.typolink parameter="{address.www}" class="hover:text-yellow-light hover:underline">{address.wwwSimplified -> bdp:uriHost()}</f:link.typolink>
                        </li>
                    </f:if>
                </ul>
            </f:if>
        </div>
    </div>
</div>
</html>
