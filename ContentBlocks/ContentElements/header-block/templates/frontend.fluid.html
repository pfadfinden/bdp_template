<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
    xmlns:bdp="http://typo3.org/ns/Pfadfinden/BdpTemplate/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<div class="bg-yellow-500 pb-10 text-blue-500 dark:bg-blue-500 dark:text-yellow-500">
    <div class="3xl:px-25 relative mx-auto w-full px-3 md:px-5 lg:px-10 xl:px-20">
        <h1 class="relative pt-16 text-4xl font-bold md:text-5xl">
            {data -> f:render.text(field: 'header')}
            <bdp:inlineSvg src="EXT:bdp_template/Resources/Public/Images/lines/welle.svg" class="mt-2 -ml-2 text-red-500 lg:-ml-6 dark:text-white" width="220px" />
        </h1>
        <f:variable name="subheader" value="{data -> f:render.text(field: 'subheader')}" />
        <f:if condition="{subheader}">
            <p class="mt-3 text-lg">{subheader}</p>
        </f:if>
    </div>
</div>
</html>
